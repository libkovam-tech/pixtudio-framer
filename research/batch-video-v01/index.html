<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>PIXTUDIO Batch Video V0.1 Diagnostic</title></head>
<body>
  <main>
    <h1>Batch Video V0.1 Diagnostic</h1>
    <p>Local research stand. Select one video. Processing stays in this browser.</p>
    <input id="file" type="file" accept="video/*,.mov,.mkv,.webm,.mp4">
    <button id="run" type="button">RUN FULL DIAGNOSTIC</button>
    <button id="cancel" type="button">CANCEL</button>
    <button id="save" type="button" disabled>DOWNLOAD JSON</button>
    <section><h2>Summary</h2><dl id="summary"></dl></section>
    <h2>Diagnostic JSON</h2>
    <pre id="result" aria-live="polite">Choose a file.</pre>
  </main>
  <script type="module" src="/diagnostic.mjs"></script>
</body>
</html>
